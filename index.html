<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlareDrive-R2 - 优雅的 Cloudflare R2 网盘文件库</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@3.2.37/dist/vue.global.min.js" integrity="sha384-Df1xTJ3vtpvClSo05F2OSQ0jYBGb9/IR1kcZ4R7zuzr3GNrsu7DVf5AMKxim9CuB" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@0.27.2/dist/axios.min.js" integrity="sha384-vmbbJNC6Li6w5GzrydJ5cd4ttMcLJ/Nl5xgp5saZ5QV8fp7zdsrFDcCasGqOFlaC" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue3-sfc-loader@0.9.5/dist/vue3-sfc-loader.min.js" integrity="sha384-sm0K7hTb0FAFlXbxgukZ7QldrlFIFbHc889JQ3bzkKLLFa07xXwSuvwrxrXLNyfT" crossorigin="anonymous"></script>
    <!-- 字体 CSS 没有 integrity：static.zeoseven.com 在当前构建环境不可达，无法计算哈希；如需锁定，改用本地字体或从可达网络取哈希后补上 -->
    <!-- 字体 CSS 改为非阻塞加载：页面先用系统字体渲染，字体到了再换，避免首屏被字体请求拖住 -->
    <link rel='stylesheet' href='https://static.zeoseven.com/zsft/243/main/result.css' media='print' onload="this.media='all'" />
    <link rel="prefetch" href="/assets/main.mjs" />
    <link rel="stylesheet" href="/assets/main.css" />
    <link rel="manifest" href="/assets/manifest.json" />
    <link rel="icon" type="image/png" href="/favicon.ico" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css" integrity="sha384-02yn80EH0cF+s23taAmuhEZ04p3CTbQvV0QZMr2reUxajpfvcLNKlzsPkZwx14mf" crossorigin="anonymous"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js" integrity="sha384-S5+w/JlcNAOymqXGNrvzn2F++XsaHTJdex6KE5VbKryfFgqJiRUJOgOkUqaiOZTf" crossorigin="anonymous"></script>
  </head>
  <body>
    <div id="app">
      <!-- D4：首屏占位，Vue 挂载后会被替换，避免白屏 -->
      <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; color: #666; font-size: 18px; font-family: sans-serif;">FlareDrive 加载中...</div>
    </div>
    <script>
      const { loadModule } = window["vue3-sfc-loader"];

      const options = {
        moduleCache: { vue: Vue },
        async getFile(url) {
          const res = await fetch(url);
          if (!res.ok)
            throw Object.assign(new Error(res.statusText + " " + url), { res });
          return {
            getContentData: (asBinary) =>
              asBinary ? res.arrayBuffer() : res.text(),
          };
        },
        addStyle(textContent) {
          const style = document.createElement("style");
          style.textContent = textContent;
          const ref = document.head.getElementsByTagName("style")[0] || null;
          document.head.insertBefore(style, ref);
        },
      };

      const app = Vue.createApp({
        components: {
          App: Vue.defineAsyncComponent(() =>
            loadModule("/assets/App.vue", options)
          ),
        },
        template: "<App></App>",
      });

      app.mount("#app");
    </script>

    <script type="module"></script>
  </body>
</html>
